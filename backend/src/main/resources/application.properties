spring.application.name=thunderfood-backend
server.port=8080

# Nạp biến môi trường từ file .env (định dạng KEY=VALUE, không bọc giá trị trong dấu nháy).
# Thử cả .env ở thư mục chạy và ở thư mục cha, nên chạy từ backend/ hay từ gốc repo đều đọc được .env ở gốc.
# Biến môi trường thật của hệ điều hành (docker compose, run config IntelliJ) vẫn được ưu tiên hơn giá trị trong .env.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/thunderfood}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.sql.init.mode=never

server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

spring.jackson.serialization.write-dates-as-timestamps=false

app.upload-dir=uploads
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# Chat dùng Claude (Anthropic), cần đặt
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:not-configured}
# Spring AI 1.1.1 luôn gửi temperature cho Claude; các model Claude mới (5.x) từ chối tham số này nên dùng Haiku 4.5.
spring.ai.anthropic.chat.options.model=claude-haiku-4-5
spring.ai.anthropic.chat.options.max-tokens=1000

# Ollama phải đang chạy trên máy (mặc định http://localhost:11434) và đã pull nomic-embed-text (qwen2.5:3b chỉ cần khi chat=ollama).
spring.ai.model.chat=anthropic
spring.ai.ollama.chat.options.model=qwen2.5:3b
spring.ai.model.embedding=ollama
spring.ai.ollama.embedding.options.model=nomic-embed-text

spring.ai.vectorstore.qdrant.host=${QDRANT_HOST:localhost}
spring.ai.vectorstore.qdrant.port=${QDRANT_PORT:6334}
spring.ai.vectorstore.qdrant.collection-name=thunderfood-policies-v2
spring.ai.vectorstore.qdrant.initialize-schema=true

app.ai.rag.enabled=${AI_RAG_ENABLED:false}
app.ai.rag.top-k=4
app.ai.rag.similarity-threshold=0.5
