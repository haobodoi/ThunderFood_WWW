# Chạy toàn bộ ThunderFood để test: docker compose up -d --build, rồi mở http://localhost:5173
# Dữ liệu mẫu chỉ được nạp khi volume db-data còn trống; tạo lại từ đầu: docker compose down -v
name: thunderfood

services:
  db:
    image: mariadb:11.4
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:-123456}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - db-data:/var/lib/mysql
      - ./backend/database/thunderfood_final.sql:/docker-entrypoint-initdb.d/01-thunderfood-final.sql:ro
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  backend:
    build: ./backend
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_RAG_ENABLED: ${AI_RAG_ENABLED:-false}
      QDRANT_HOST: qdrant
      SPRING_DATASOURCE_URL: jdbc:mariadb://db:3306/thunderfood
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-123456}
      APP_UPLOAD_DIR: /app/uploads
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/localhost/8080"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  frontend:
    build: ./frontend
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data:
  uploads:
  qdrant-data:
